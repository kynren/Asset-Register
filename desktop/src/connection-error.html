<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Connection failed</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #e6e9f2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 420px;
    padding: 32px;
    text-align: center;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 10px;
  }
  p {
    font-size: 13px;
    color: #9aa3b8;
    line-height: 1.6;
    margin: 0 0 6px;
  }
  code {
    display: block;
    margin: 14px 0 22px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #131a29;
    border: 1px solid #2a3040;
    color: #ff9b6b;
    font-size: 12px;
    word-break: break-all;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  button, a.button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #2a3040;
    background: #131a29;
    color: #e6e9f2;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    box-sizing: border-box;
  }
  button.primary {
    border: none;
    background: linear-gradient(135deg, #863bff, #7e14ff);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Couldn't reach the server</h1>
    <p id="message">The configured Asset Register server didn't respond.</p>
    <code id="detail"></code>
    <div class="row">
      <a id="changeServer" class="button" href="kynren-desktop://change-server">Change Server URL</a>
      <button id="retry" class="primary">Retry</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url") || "";
    const error = params.get("error") || "";
    document.getElementById("message").textContent = url
      ? `Couldn't reach ${url}. Check that it's online and that this machine has network access to it.`
      : "Couldn't reach the configured server.";
    document.getElementById("detail").textContent = error;

    document.getElementById("retry").addEventListener("click", () => {
      window.location.href = url || window.location.href;
    });
  </script>
</body>
</html>
