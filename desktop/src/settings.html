<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Connect to Kynren Asset Register</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #e6e9f2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 380px;
    padding: 32px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #863bff, #47bfff);
    -webkit-mask-image: url("../assets/icon.png");
    mask-image: url("../assets/icon.png");
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
  }
  p.subtitle {
    margin: 0 0 24px;
    font-size: 13px;
    color: #9aa3b8;
    line-height: 1.5;
  }
  label {
    display: block;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9aa3b8;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a3040;
    background: #131a29;
    color: #e6e9f2;
    font-size: 14px;
    margin-bottom: 6px;
  }
  input:focus {
    outline: none;
    border-color: #863bff;
  }
  .error {
    min-height: 18px;
    font-size: 12px;
    color: #ff6b6b;
    margin-bottom: 12px;
    text-align: left;
  }
  button {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #863bff, #7e14ff);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>Kynren Asset Register</h1>
    <p class="subtitle">Enter the web address of your Asset Register deployment — the same one you'd normally open in a browser.</p>
    <form id="form">
      <label for="url">Server URL</label>
      <input id="url" type="text" placeholder="https://assets.yourcompany.com" autofocus />
      <div class="error" id="error"></div>
      <button type="submit" id="submit">Connect</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");

    window.desktopSetup.getServerUrl().then((url) => {
      if (url) input.value = url;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Connecting...";
      const result = await window.desktopSetup.setServerUrl(input.value);
      if (!result.ok) {
        errorEl.textContent = result.error;
        submitBtn.disabled = false;
        submitBtn.textContent = "Connect";
      }
    });
  </script>
</body>
</html>
