services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kynren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kynren_asset_register}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kynren}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Without this the container defaults to UTC regardless of where the VPS or its users
      # actually are. Lighting Automations store timezone-naive wall-clock times (whatever the
      # browser's <input type="time"> shows), and the scheduler compares them against this
      # container's local clock — so a mismatch here means automations silently fire at the
      # wrong wall-clock hour instead of not firing at all, which looks identical to "never
      # triggers" if you're watching for it at your own local time. Defaults to Europe/London
      # (correctly handles the GMT/BST switch); override via TZ in .env if that's ever wrong.
      TZ: ${TZ:-Europe/London}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kynren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kynren_asset_register}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN in .env, e.g. https://your-domain.com}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?set REFRESH_JWT_SECRET in .env}
      REFRESH_JWT_EXPIRES_IN: ${REFRESH_JWT_EXPIRES_IN:-7d}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-kynren_refresh}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - server_uploads:/app/server/uploads
    expose:
      - "4000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  server_uploads:
  caddy_data:
  caddy_config:
